name: Build mod

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: 9.3.0

      - name: Build
        run: gradle build

      - uses: actions/upload-artifact@v4
        with:
          name: tomax-pack-toggle
          path: build/libs/tomax-pack-toggle-*[0-9].jar
